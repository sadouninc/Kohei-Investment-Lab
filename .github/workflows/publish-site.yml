name: Publish Sado Investment Lab

on:
  push:
    branches:
      - main
    paths:
      - "00_Framework/**"
      - "01_Portfolio/Transactions/**"
      - "02_Themes/**"
      - "03_Companies/**"
      - "04_Market/**"
      - "08_Trade_Analysis/**"
      - "scripts/**"
      - "tests/**"
      - "assets/images/**"
      - ".github/pages/**"
      - ".github/workflows/publish-site.yml"
  pull_request:
    paths:
      - "00_Framework/**"
      - "01_Portfolio/Transactions/**"
      - "02_Themes/**"
      - "03_Companies/**"
      - "04_Market/**"
      - "08_Trade_Analysis/**"
      - "scripts/**"
      - "tests/**"
      - "assets/images/**"
      - ".github/pages/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Trade Journal mapping
        run: python3 -m unittest discover -s .github/pages -p "test_*.py"

      - name: Test trade analysis pipeline
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Prepare site
        run: python3 .github/pages/build_site.py

      - name: Verify generated routes
        shell: bash
        run: |
          set -euo pipefail
          test -f site-src/index.md
          test -f site-src/framework/index.md
          test -f site-src/themes/index.md
          test -f site-src/companies/index.md
          test -f site-src/market-analysis/index.md
          test -f site-src/market-analysis/2026/2026-08-05/index.md
          test -f site-src/trade-journal/index.md
          test -f site-src/trade-analysis/index.md
          test -f site-src/trade-journal/2026/08/2026-08-03/index.md
          test -f site-src/trade-journal/2026/08/2026-08-04/index.md
          test -f site-src/trade-journal/2026/08/2026-08-05/index.md
          test -f site-src/companies/semiconductor/4063-shinetsu/index.md
          test -f site-src/companies/semiconductor/3110-nittobo/index.md
          grep -q "4063-shinetsu" site-src/companies/index.md
          grep -q "3110-nittobo" site-src/companies/index.md
          grep -q "2026-08-05" site-src/market-analysis/index.md
          grep -q "nikkei-daily-decline-factors-2026-08-05.png" site-src/market-analysis/2026/2026-08-05/index.md
          test -f site-src/assets/images/market-analysis/2026/nikkei-daily-decline-factors-2026-08-05.png
          grep -q "2026-08-03" site-src/trade-journal/index.md
          grep -q "2026-08-04" site-src/trade-journal/index.md
          grep -q "期待値指数" site-src/trade-analysis/index.md
          grep -q "Today's Lesson" site-src/trade-analysis/index.md
          grep -q "Framework Candidate" site-src/trade-analysis/index.md
          grep -q "年別パフォーマンス" site-src/trade-analysis/index.md
          grep -q "月別パフォーマンス" site-src/trade-analysis/index.md
          grep -q "累積結果・ドローダウン" site-src/trade-analysis/index.md
          grep -q "データ品質" site-src/trade-analysis/index.md
          ! grep -Eq "security_(code|name)|net_pnl|gross_pnl|quantity|price" site-src/trade-analysis/index.md
          ! grep -Eq "日東紡|JX金属|3110|5016" site-src/trade-analysis/index.md
          grep -q "2026-08-05" site-src/trade-journal/index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site-src
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

