name: Daily Knowledge Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      event_fixture:
        description: "Repository-relative JSON event fixture for manual validation"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-knowledge-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'daily-knowledge')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve event payload
        id: event
        shell: bash
        run: |
          set -euo pipefail
          fixture="${{ inputs.event_fixture }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test -n "$fixture" || { echo "workflow_dispatch requires event_fixture"; exit 1; }
            test -f "$fixture" || { echo "Event fixture not found: $fixture"; exit 1; }
            echo "path=$fixture" >> "$GITHUB_OUTPUT"
          else
            echo "path=$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: |
          python3 -m unittest \
            tests.test_daily_knowledge_capture \
            tests.test_daily_knowledge_planner \
            tests.test_trade_journal_integrator

      - name: Capture daily-knowledge issue
        run: |
          python3 scripts/daily_knowledge_capture.py \
            --event "${{ steps.event.outputs.path }}" \
            --output-dir data/generated/diagnostics/daily-knowledge

      - name: Resolve capture path
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          path="$(find data/generated/diagnostics/daily-knowledge -maxdepth 1 -type f -name 'issue-*.json' -print -quit)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Generate AI integration plan
        run: |
          python3 scripts/daily_knowledge_planner.py \
            --input "${{ steps.capture.outputs.path }}" \
            --output data/generated/diagnostics/daily-knowledge/integration-plan.json

      - name: Apply Trade Journal integration
        run: |
          python3 scripts/trade_journal_integrator.py \
            --input data/generated/diagnostics/daily-knowledge/integration-plan.json \
            --repo-root . \
            --diagnostic data/generated/diagnostics/daily-knowledge/trade-journal-result.json

      - name: Prepare integration branch
        id: change
        shell: bash
        run: |
          set -euo pipefail
          issue="$(python3 -c "import json; print(json.load(open('data/generated/diagnostics/daily-knowledge/integration-plan.json'))['issue']['number'])")"
          date="$(python3 -c "import json; print(json.load(open('data/generated/diagnostics/daily-knowledge/integration-plan.json'))['plan']['date'] or 'unknown-date')")"
          branch="daily-knowledge/${date}-issue-${issue}"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- 01_Portfolio/Transactions; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add 01_Portfolio/Transactions
          git commit -m "Integrate daily knowledge from issue #${issue}"
          git push --force-with-lease origin "$branch"

      - name: Create pull request
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.change.outputs.branch }}
          ISSUE: ${{ steps.change.outputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(python3 -c "import json; print(json.load(open('data/generated/diagnostics/daily-knowledge/trade-journal-result.json'))['target_file'])")"
          unresolved="$(python3 -c "import json; print(len(json.load(open('data/generated/diagnostics/daily-knowledge/trade-journal-result.json'))['unresolved']))")"
          url="$(gh pr create --base main --head "$BRANCH" --title "Integrate Daily Knowledge from issue #${ISSUE}" --body "## Daily Knowledge Integration

Source: #${ISSUE}

- Trade Journal target: \`${target}\`
- Unresolved items kept non-canonical: ${unresolved}
- Investor DNA / Framework / Companies remain proposal-only in this MVP.
- Exact SBI CSV-derived trade facts remain authoritative.
- Unit tests ran before branch creation.

Human review is required before merge.

Refs #75")"
          gh issue comment "$ISSUE" --body "Daily Knowledge Integrator created a review PR: ${url}"

      - name: Report no repository change
        if: steps.change.outputs.changed == 'false' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.change.outputs.issue }}
        run: gh issue comment "$ISSUE" --body "Daily Knowledge Integrator completed safely; the validated plan required no Trade Journal repository change, so no empty PR was created."

      - name: Upload Daily Knowledge diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: daily-knowledge-issue-${{ steps.change.outputs.issue || github.run_id }}
          path: data/generated/diagnostics/daily-knowledge/*.json
          if-no-files-found: error
          retention-days: 14
