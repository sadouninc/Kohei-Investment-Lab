name: Publish Framework Book

on:
  push:
    branches:
      - main
    paths:
      - "00_Framework/**"
      - ".github/pages/**"
      - ".github/workflows/publish-framework-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare book
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p book-src/_layouts book-src/assets
          cp .github/pages/book-header.md book-src/index.md
          cp .github/pages/book.html book-src/_layouts/book.html
          cp .github/pages/book.css book-src/assets/book.css

          while IFS='|' read -r anchor file; do
            printf '\n<section class="book-chapter" id="%s" markdown="1">\n' "$anchor" >> book-src/index.md
            cat "$file" >> book-src/index.md
            printf '\n</section>\n' >> book-src/index.md
          done <<'CHAPTERS'
          philosophy|00_Framework/01_Investment_Philosophy.md
          psychology|00_Framework/02_Market_Psychology.md
          thinking|00_Framework/03_Thinking_Process.md
          rules|00_Framework/04_Investment_Rules.md
          evaluation|00_Framework/05_Evaluation_Framework.md
          allocation|00_Framework/06_Capital_Allocation.md
          lessons|00_Framework/07_Lessons_Learned.md
          metrics|00_Framework/08_Original_Metrics.md
          CHAPTERS

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("book-src/index.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"```math\s*\n(.*?)\n```",
              lambda match: "\n$\n" + match.group(1).strip() + "\n$\n",
              text,
              flags=re.DOTALL,
          )
          path.write_text(text, encoding="utf-8")
          PY

          printf '\n<p class="book-end">Sado Investment Lab — Framework</p>\n' >> book-src/index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./book-src
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
